name: Site checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify generated styles
        run: python3 scripts/build-css.py --check
      - name: Verify internal links and assets
        run: python3 scripts/check-site.py
