    <!-- 首屏前确定唯一画风：黑白暗色，彩色明亮。 -->
    <script>
    (function () {
      var ink = 'mono';
      try { if (localStorage.getItem('ryan-comic-ink') === 'color') ink = 'color'; } catch (e) {}
      var root = document.documentElement;
      root.classList.add('page-arriving');
      // Attach before styles, images and fonts can delay the footer script.
      // pagereveal runs before the new page's first paint (including when the
      // browser aborts a native cross-document view transition).
      function clearArrival() {
        root.classList.remove('page-arriving', 'page-view-transitioning', 'page-fallback-arriving');
      }
      if ('onpagereveal' in window) {
        window.addEventListener('pagereveal', function (event) {
          if (!root.classList.contains('page-arriving')) return;
          root.classList.add(event.viewTransition ? 'page-view-transitioning' : 'page-fallback-arriving');
          window.setTimeout(clearArrival, 1600);
        }, { once: true });
      } else {
        root.classList.add('page-fallback-arriving');
        window.addEventListener('pageshow', function () { window.setTimeout(clearArrival, 1600); }, { once: true });
      }
      window.addEventListener('pageshow', function (event) {
        if (event.persisted) clearArrival();
      });
      root.dataset.ink = ink;
      document.documentElement.dataset.theme = ink === 'color' ? 'light' : 'dark';
      document.querySelector('meta[name="theme-color"]').content = ink === 'color' ? '#fff8e9' : '#343432';
    })();
    </script>
