    <!-- 首屏前确定唯一画风：黑白暗色，彩色明亮。 -->
    <script>
    (function () {
      var ink = 'mono';
      try { if (localStorage.getItem('ryan-comic-ink') === 'color') ink = 'color'; } catch (e) {}
      var root = document.documentElement;
      root.dataset.ink = ink;
      document.documentElement.dataset.theme = ink === 'color' ? 'light' : 'dark';
      document.querySelector('meta[name="theme-color"]').content = ink === 'color' ? '#fff8e9' : '#343432';
    })();
    </script>
    <script>
    /* A real click may navigate without the browser's cross-document View
       Transition. Mark only that destination for the same side entrance. */
    var chapterKey = 'ryan-chapter-intent';
    try {
      var chapterIntent = JSON.parse(sessionStorage.getItem(chapterKey) || 'null');
      sessionStorage.removeItem(chapterKey);
      if (chapterIntent && chapterIntent.path === location.pathname + location.search &&
          Date.now() - chapterIntent.at < 8000) {
        document.documentElement.classList.add('chapter-fallback');
      }
    } catch (error) { /* Private storage restrictions: normal navigation. */ }
    addEventListener('load', function () {
      setTimeout(function () { document.documentElement.classList.remove('chapter-fallback'); }, 850);
    });
    /* The outgoing page stays a complete frame; only the arriving page lifts
       speech and art panels out for their side entrance. */
    addEventListener('pageswap', function () {
      document.documentElement.classList.remove('chapter-arriving');
    });
    addEventListener('pagereveal', function (event) {
      if (!event.viewTransition) return;
      var root = document.documentElement;
      root.classList.remove('chapter-fallback');
      root.classList.add('chapter-arriving');
      // Keep the next click until the current page-turn has landed. Remove
      // snapshot names afterwards so a later navigation starts from a clean page.
      var settle = function () {
        root.classList.remove('chapter-arriving');
        var next = window.__chapterQueuedUrl;
        window.__chapterQueuedUrl = null;
        if (next && next !== location.href) {
          try {
            var queued = new URL(next);
            sessionStorage.setItem(chapterKey, JSON.stringify({
              path: queued.pathname + queued.search, at: Date.now()
            }));
          } catch (error) { /* Native navigation still works. */ }
          location.assign(next);
        }
      };
      event.viewTransition.finished.then(settle, settle);
    });
    </script>
